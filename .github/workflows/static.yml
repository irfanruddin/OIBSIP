name: Deploy OIBSIP Projects to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "WebDev-L2-Calculator/**"
      - "WebDev-L2-TributePage/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p public/tribute-page

          cp -R WebDev-L2-Calculator/. public/

          cp -R WebDev-L2-TributePage/. public/tribute-page/

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
